name: 'Auth Route Guard'
description: 'Fail the build when a Next.js app exposes a server secret via NEXT_PUBLIC_*, or ships a mutating route with no auth check.'
branding:
  icon: 'lock'
  color: 'green'
inputs:
  dir:
    description: 'Project root to scan.'
    required: false
    default: '.'
  allow:
    description: 'Comma-separated tokens to silence (rule:unauth_mutation or a route path / env name).'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        AUTH_GUARD_ALLOW: ${{ inputs.allow }}
      run: npx --yes airlock-auth "${{ inputs.dir }}"
