name: 'Auth Route Guard'
description: 'Fails the build when a Next.js app exposes a server secret via NEXT_PUBLIC_*. Warns on mutating routes with no auth check and webhooks with no signature verification.'
branding:
  icon: 'lock'
  color: 'green'
inputs:
  dir:
    description: 'Project root to scan.'
    required: false
    default: '.'
  allow:
    description: 'Comma-separated tokens to silence (rule:unauth_mutation or a route path / env name).'
    required: false
    default: ''
  auth-fn:
    description: 'Comma-separated names of YOUR auth helpers, so a route guarded by them is not flagged (e.g. requireMember,assertTenant).'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        AUTH_GUARD_ALLOW: ${{ inputs.allow }}
        AUTH_GUARD_AUTH_FNS: ${{ inputs.auth-fn }}
      run: npx --yes airlock-auth "${{ inputs.dir }}"
